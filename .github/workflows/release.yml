name: Release Rust crate

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; must equal v + Cargo version
        required: true
        type: string
      publish_crates_io:
        description: Also publish the verified crate to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-fresh-msrv-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          persist-credentials: false
      - name: Freeze the verified source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.85.1'
      - name: Verify a lockfile-free external consumer on the MSRV
        run: scripts/check-msrv-consumer.sh

  verify-and-build:
    needs: verify-fresh-msrv-consumer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-fresh-msrv-consumer.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.85.1'
          components: rustfmt, clippy
      - name: Install pinned security auditor
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Require exact release tag commit on main
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ -n "$EVENT_SHA" ]; then
            test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          fi
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag and package
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          scripts/check-release-tag.sh "$RELEASE_TAG"
          scripts/check-openapi.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc
          cargo audit --deny warnings
          cargo package --locked
      - name: Collect immutable package and checksum
        run: |
          mkdir -p dist
          cp target/package/viapost-*.crate dist/
          cd dist
          sha256sum -- ./viapost-*.crate > SHA256SUMS
          chmod a-w -- ./viapost-*.crate SHA256SUMS
      - name: Smoke-test packaged source as an isolated consumer
        run: |
          mkdir -p /tmp/viapost-rust-consumer
          tar -xzf dist/viapost-*.crate -C /tmp/viapost-rust-consumer
          cd /tmp/viapost-rust-consumer/viapost-*
          cargo test --locked --doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attest-build-provenance:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-distribution
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  publish-github-release:
    needs: [verify-and-build, attest-build-provenance]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-distribution
          path: dist
      - name: Publish verified crate and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
            published="$(mktemp -d)"
            gh release download "$RELEASE_TAG" --dir "$published"
            diff -q "$published/SHA256SUMS" dist/SHA256SUMS
            (cd "$published" && sha256sum -c SHA256SUMS)
            (cd dist && sha256sum -c SHA256SUMS)
            test "$(find "$published" -maxdepth 1 -type f -printf '%f\n' | sort)" = \
              "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
            for artifact in dist/*; do
              cmp --silent "$artifact" "$published/$(basename "$artifact")"
            done
            if [ "$release_is_draft" = true ]; then
              gh release edit "$RELEASE_TAG" --draft=false
            fi
          else
            gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
            gh release edit "$RELEASE_TAG" --draft=false
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false

  publish-to-crates-io:
    needs: publish-github-release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates_io == true
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'push' && github.sha || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: '1.85.1'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-distribution
          path: dist
      - name: Reproduce the attested registry package
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          scripts/check-release-tag.sh "$RELEASE_TAG"
          (cd dist && sha256sum -c SHA256SUMS)
          cargo package --locked
          attested_package="$(find dist -maxdepth 1 -type f -name 'viapost-*.crate' -print -quit)"
          reproduced_package="$(find target/package -maxdepth 1 -type f -name 'viapost-*.crate' -print -quit)"
          test -n "$attested_package"
          test -n "$reproduced_package"
          cmp --silent "$attested_package" "$reproduced_package"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish --locked --no-verify
