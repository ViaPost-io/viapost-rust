name: Release Rust crate

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; must equal v + Cargo version
        required: true
        type: string
      publish_crates_io:
        description: Also publish the verified crate to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: '1.85.1'
          components: rustfmt, clippy
      - name: Install pinned security auditor
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Require exact release tag commit on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Verify tag and package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          scripts/check-release-tag.sh "$RELEASE_TAG"
          scripts/check-openapi.sh
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets
          cargo test --locked --doc
          cargo audit --deny warnings
          cargo package --locked
      - name: Collect immutable package and checksum
        run: |
          mkdir -p dist
          cp target/package/viapost-*.crate dist/
          cd dist
          sha256sum viapost-*.crate > SHA256SUMS
          chmod a-w viapost-*.crate SHA256SUMS
      - name: Smoke-test packaged source as an isolated consumer
        run: |
          mkdir -p /tmp/viapost-rust-consumer
          tar -xzf dist/viapost-*.crate -C /tmp/viapost-rust-consumer
          cd /tmp/viapost-rust-consumer/viapost-*
          cargo test --locked --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  attach-to-github-release:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: rust-distribution
          path: dist
      - name: Attach crate and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" dist/*

  attest-build-provenance:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: rust-distribution
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/viapost-*.crate

  publish-to-crates-io:
    needs: [verify-and-build, attach-to-github-release, attest-build-provenance]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_crates_io == true
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: rust-distribution
          path: dist
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          mkdir -p /tmp/viapost-rust-publish
          tar -xzf dist/viapost-*.crate -C /tmp/viapost-rust-publish
          cd /tmp/viapost-rust-publish/viapost-*
          cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"
