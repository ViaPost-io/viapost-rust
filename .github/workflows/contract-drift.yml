name: Contract drift

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare with canonical main contract
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/ViaPost-io/base-code/main/docs/openapi/public.yaml \
            --output /tmp/viapost-public.yaml
          if ! cmp -s openapi.yaml /tmp/viapost-public.yaml; then
            echo 'The canonical public contract changed; update the SDK surface and vendored OpenAPI.' >&2
            exit 1
          fi
          scripts/check-openapi.sh openapi.yaml

