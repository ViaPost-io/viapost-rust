name: Contract drift

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.1"
      - name: Compare with canonical main contract
        run: |
          curl --fail --location --silent --show-error \
            https://docs.viapost.io/openapi/public.yaml \
            --output /tmp/viapost-public.yaml
          if ! ruby -ryaml -e \
            'abort unless YAML.safe_load_file(ARGV[0], aliases: false) == YAML.safe_load_file(ARGV[1], aliases: false)' \
            openapi.yaml /tmp/viapost-public.yaml; then
            echo 'The canonical public contract changed; update the SDK surface and vendored OpenAPI.' >&2
            exit 1
          fi
          scripts/check-openapi.sh openapi.yaml
