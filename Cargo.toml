[package]
name = "viapost"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Official async Rust SDK for the ViaPost email API"
license = "MIT"
repository = "https://github.com/ViaPost-io/viapost-rust"
homepage = "https://viapost.io"
documentation = "https://docs.rs/viapost"
readme = "README.md"
keywords = ["email", "api", "sdk", "viapost"]
categories = ["api-bindings", "email"]
include = [
    "src/**",
    "tests/**",
    "openapi.yaml",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
]

[dependencies]
futures-util = "=0.3.34"
httpdate = "=1.0.3"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "stream", "gzip", "brotli", "deflate", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["time"] }
url = "=2.5.8"
# reqwest/url allow newer ICU and yoke patches whose MSRVs exceed our declared Rust 1.85 floor.
# Keep lockfile-free consumers on the newest compatible line until the SDK raises its own MSRV.
icu_collections = { version = "=2.1.1", default-features = false }
icu_locale_core = { version = "=2.1.1", default-features = false }
icu_normalizer = { version = "=2.1.1", default-features = false }
icu_normalizer_data = { version = "=2.1.1", default-features = false }
icu_properties = { version = "=2.1.2", default-features = false }
icu_properties_data = { version = "=2.1.2", default-features = false }
icu_provider = { version = "=2.1.1", default-features = false }
idna_adapter = { version = "=1.2.1", default-features = false }
yoke-derive = "=0.8.2"

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
wildcard_imports = "allow"
